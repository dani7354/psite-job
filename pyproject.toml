[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "psite-job"
version = "2.0.0"
description = "Services for the psite-web site"
requires-python = ">=3.14"
dependencies = [
    "mysql-connector-python",
    "sqlalchemy",
    "requests"
]

[project.optional-dependencies]
dev = ["pylint", "pytest", "black"]

[tool.setuptools]
py-modules = ["run_project_updates_job", "run_message_job"]

[tool.setuptools.packages.find]
include = ["psitejob*"]

[tool.setuptools.package-data]
psitejob = ["mail_templates/*.html"]

[project.scripts]
run-project-updates-job = "run_project_updates_job:main"
run-message-job = "run_message_job:main"